spring.application.name=imperio-dog-api
server.port=8080

spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/imperiodog?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

c6.api-base-url=${C6_API_BASE_URL:https://baas-api-sandbox.c6bank.info}
c6.client-id=${C6_CLIENT_ID:}
c6.client-secret=${C6_CLIENT_SECRET:}
c6.certificate-path=${C6_CERTIFICATE_PATH:}
c6.certificate-password=${C6_CERTIFICATE_PASSWORD:}
c6.billing-scheme=${C6_BILLING_SCHEME:21}
c6.webhook-url=${C6_WEBHOOK_URL:}
c6.webhook-token=${C6_WEBHOOK_TOKEN:}
c6.status-sync-interval-ms=${C6_STATUS_SYNC_INTERVAL_MS:300000}
c6.status-sync-initial-delay-ms=${C6_STATUS_SYNC_INITIAL_DELAY_MS:60000}
