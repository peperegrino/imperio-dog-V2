spring.application.name=imperio-dog-api

# Porta: PORT (Render/Railway/Cloud Run) ou WEBSITES_PORT (Azure App Service); padrao 8080
server.port=${PORT:${WEBSITES_PORT:8080}}
server.forward-headers-strategy=framework

# Em desenvolvimento local, as variaveis podem vir de um arquivo .env (nunca versionado)
spring.config.import=optional:file:.env[.properties]

# ---------- Banco de dados (PostgreSQL em nuvem: Neon, Supabase, Azure Database for PostgreSQL) ----------
# Sem valores padrao: a aplicacao exige DB_URL, DB_USERNAME e DB_PASSWORD.
# Exemplo Neon:  jdbc:postgresql://<host>/<db>?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:540000}

# update cria/ajusta tabelas no primeiro deploy. Em producao madura, use validate + migrations.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---------- JWT ----------
# O fallback abaixo existe SOMENTE para desenvolvimento local.
# O JwtTokenProvider recusa iniciar com ele quando o profile "prod" esta ativo.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-do-not-use-in-prod-0123456789}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ---------- CORS (valores separados por virgula) ----------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8081}
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:}

# ---------- Primeiro administrador ----------
# Criado na inicializacao SOMENTE se ainda nao existir nenhum ADMIN no banco.
app.bootstrap-admin.name=${ADMIN_NAME:Administrador}
app.bootstrap-admin.email=${ADMIN_EMAIL:}
app.bootstrap-admin.password=${ADMIN_PASSWORD:}

# ---------- Health check ----------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---------- C6 Bank ----------
c6.api-base-url=${C6_API_BASE_URL:https://baas-api-sandbox.c6bank.info}
c6.client-id=${C6_CLIENT_ID:}
c6.client-secret=${C6_CLIENT_SECRET:}
c6.certificate-path=${C6_CERTIFICATE_PATH:}
c6.certificate-password=${C6_CERTIFICATE_PASSWORD:}
c6.billing-scheme=${C6_BILLING_SCHEME:21}
c6.webhook-url=${C6_WEBHOOK_URL:}
c6.webhook-token=${C6_WEBHOOK_TOKEN:}
c6.status-sync-interval-ms=${C6_STATUS_SYNC_INTERVAL_MS:300000}
c6.status-sync-initial-delay-ms=${C6_STATUS_SYNC_INITIAL_DELAY_MS:60000}
